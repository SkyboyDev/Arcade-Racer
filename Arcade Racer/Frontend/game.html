<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Track - Race</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; text-align: center; font-weight: bold; background: rgba(0, 0, 0, 0.8); padding: 30px; border-radius: 10px; border: 2px solid #4da6ff; z-index: 50; transition: opacity 0.3s ease; pointer-events: none; }
        
        .info-panel { position: absolute; bottom: 20px; left: 20px; color: #fff; background: rgba(0, 0, 0, 0.7); padding: 12px 18px; border-radius: 8px; font-size: 14px; line-height: 1.6; border: 1px solid #4da6ff; z-index: 5; }
        
        #hud { position: absolute; top: 20px; left: 20px; width: 250px; z-index: 5; pointer-events: none; }
        #lap-text { color: #fff; font-size: 28px; font-weight: 900; font-style: italic; text-shadow: 0 0 10px #4da6ff; margin-bottom: 10px; letter-spacing: 2px; }
        .nitro-title { color: #00ffff; font-weight: bold; margin-bottom: 5px; text-shadow: 0 0 8px #00aaff; font-style: italic; font-size: 16px; letter-spacing: 1px; }
        .nitro-container { width: 100%; height: 18px; background: rgba(0,0,0,0.7); border: 2px solid #00aaff; border-radius: 10px; overflow: hidden; }
        #nitro-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #0044ff, #00ffff); transition: width 0.05s linear; }

        #live-leaderboard {
            position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.75); 
            border: 2px solid #ffaa00; border-radius: 8px; padding: 15px; width: 200px;
            color: white; font-family: 'Segoe UI', Tahoma, sans-serif; z-index: 5; pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }

        #speedometer { position: absolute; bottom: 20px; right: 20px; color: #fff; font-style: italic; font-weight: 900; text-align: right; text-shadow: 0 0 12px #4da6ff; z-index: 5; pointer-events: none; }
        #speed-value { font-size: 54px; letter-spacing: 2px; }
        #speed-unit { font-size: 22px; color: #00ffff; margin-left: 5px; }

        #banner { position: absolute; top: -150px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: #fff; border: 4px solid #fff; border-radius: 12px; padding: 15px 50px; font-size: 42px; font-weight: 900; font-style: italic; text-transform: uppercase; text-shadow: 0 0 15px #fff; transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 20; text-align: center; white-space: nowrap; }
        #banner.show { top: 40px; }
        .key { display: inline-block; background: #333; padding: 2px 6px; border-radius: 4px; border: 1px solid #777; color: #fff; font-weight: bold; }
        .nitro-text { color: #00ffff; font-weight: bold; text-shadow: 0 0 5px #00aaff; }

        #results-ui { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; justify-content: center; align-items: center; flex-direction: column; color: white;}
        #leaderboard { background: #111; padding: 30px; border-radius: 10px; border: 2px solid #00ff00; width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 0, 0.3); }
        .rank-item { font-size: 24px; font-weight: bold; padding: 10px; margin: 5px 0; background: #222; border-radius: 5px; }
        .rank-1 { color: #ffd700; border-left: 5px solid #ffd700; background: rgba(255, 215, 0, 0.1); }
        .rank-2 { color: #c0c0c0; border-left: 5px solid #c0c0c0; background: rgba(192, 192, 192, 0.1); }
        .rank-3 { color: #cd7f32; border-left: 5px solid #cd7f32; background: rgba(205, 127, 50, 0.1); }
        .rank-4 { color: #888; border-left: 5px solid #888; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading">Loading Race Track...</div>
    
    <div id="hud">
        <div id="lap-text">LAP 1 / 3</div>
        <div class="nitro-title">NITRO</div>
        <div class="nitro-container"><div id="nitro-fill"></div></div>
    </div>
    
    <div id="live-leaderboard">
        <div style="font-size:16px; font-weight:bold; color:#ffaa00; margin-bottom:8px; border-bottom:1px solid #ffaa00; padding-bottom:5px;">LIVE POSITIONS</div>
        <div id="live-ranks"></div>
    </div>

    <div id="speedometer"><span id="speed-value">0</span><span id="speed-unit">KM/H</span></div>
    <div id="banner"></div>
    <div class="info-panel">
        <strong>Controls:</strong><br><span class="key">W</span> / <span class="key">Up</span>: Accelerate<br><span class="key">S</span> / <span class="key">Down</span>: Brake<br><span class="key">A</span> <span class="key">D</span>: Steer | <span class="key">Space</span>: <span class="nitro-text">FIRE NITRO</span>
    </div>

    <div id="results-ui">
        <div id="leaderboard">
            <h1 style="margin-top:0; font-style:italic;">RACE RESULTS</h1>
            <div id="rank-list"></div>
            <button style="margin-top: 20px; background: linear-gradient(90deg, #0044ff, #00aaff); color: white; border: 2px solid #fff; padding: 10px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase;" onclick="window.location.href='index.html'">MAIN MENU</button>
        </div>
    </div>

    <script>
        const playerId = sessionStorage.getItem('playerId');
        const playerName = sessionStorage.getItem('playerName') || "PLAYER";
        const roomCode = sessionStorage.getItem('roomCode');
        const myCarIndex = parseInt(sessionStorage.getItem('carIndex') || 0);
        const mySpawnSlot = parseInt(sessionStorage.getItem('spawnSlot') || 0);
        if (!playerId || !roomCode) window.location.href = 'index.html';

        const banner = document.getElementById('banner');
        let bannerTimeout;
        function displayBanner(text, color, duration = 2000, persistent = false) {
            banner.innerHTML = text; banner.style.borderColor = color; banner.style.color = color; banner.style.textShadow = `0 0 15px ${color}`;
            banner.classList.add('show'); clearTimeout(bannerTimeout);
            if (!persistent) bannerTimeout = setTimeout(() => banner.classList.remove('show'), duration);
        }
        function hideBanner() { banner.classList.remove('show'); }

        // Perfected Paths for the new Netlify folder structure
        const carList = [ 
            { file: 'Models/car.glb' }, 
            { file: 'Models/kart-oobi.glb' }, 
            { file: 'Models/police.glb' }, 
            { file: 'Models/race-future.glb' }, 
            { file: 'Models/sedan-sports.glb' } 
        ];

        const CAM_DIST = 30; const CAM_PULL = 6; const CAM_HEIGHT = 13; const CAM_LOOK = 6;

        const collidableObjects = []; let spawnPos, spawnTangent, startLinePos, startLineTan; let trackCenterData = []; 

        const mapData = {
            skyColorTop: "#4da6ff", fogColor: "#cce6ff", fogDensity: 0.00015,
            ambientLight: "#aaaaaa", dirLight: "#ffffff",
            terrainWidth: 4096, terrainLength: 4096, maxHeight: 150, noiseScale: 120, terrainColor: "#4b8232",
            trackWidth: 300, curveTension: 0.742, isClosedLoop: true,
            trackPoints: [ { x: 1179, y: 258, z: -451 }, { x: -277, y: 218, z: -1349 }, { x: -1121, y: 99, z: -387 }, { x: -776, y: 133, z: 168 }, { x: -292, y: 127, z: 649 }, { x: 636, y: 230, z: 1055 }, { x: 1218, y: 153, z: 554 } ]
        };

        const curveVectors = mapData.trackPoints.map(p => new THREE.Vector3(p.x, p.y, p.z));
        const trackCurve = new THREE.CatmullRomCurve3(curveVectors, mapData.isClosedLoop, 'catmullrom', mapData.curveTension);
        for(let i=0; i<1000; i++) trackCenterData.push({ pt: trackCurve.getPointAt(i/1000), tan: trackCurve.getTangentAt(i/1000).normalize() });

        const scene = new THREE.Scene(); scene.background = new THREE.Color(mapData.skyColorTop); scene.fog = new THREE.FogExp2(mapData.fogColor, mapData.fogDensity);
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" }); renderer.setPixelRatio(1); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(mapData.ambientLight, 1.2)); const dirLight = new THREE.DirectionalLight(mapData.dirLight, 0.8); dirLight.position.set(1000, 1500, 1000); scene.add(dirLight);

        function generateHighwayTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#282a2e'; ctx.fillRect(0, 0, 512, 512); ctx.fillStyle = '#1e1f22'; ctx.fillRect(0, 0, 30, 512); ctx.fillRect(512-30, 0, 30, 512); 
            ctx.fillStyle = '#ffffff'; ctx.fillRect(40, 0, 12, 512); ctx.fillRect(512-52, 0, 12, 512); 
            for(let y = 0; y < 512; y+=128) { ctx.fillRect(256-15, y+32, 12, 64); ctx.fillRect(256+3, y+32, 12, 64); }
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        function generateGuardrailTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#a0a5ad'; ctx.fillRect(0, 0, 256, 128); ctx.fillStyle = '#7a7f87'; ctx.fillRect(0, 30, 256, 15); ctx.fillRect(0, 80, 256, 15); ctx.fillStyle = '#555960'; ctx.fillRect(120, 0, 16, 128); 
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        function generateCheckeredTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 128); ctx.fillStyle = '#000000';
            for (let x = 0; x < 512; x += 64) { for (let y = 0; y < 128; y += 64) { if ((x / 64 + y / 64) % 2 === 0) ctx.fillRect(x, y, 64, 64); } }
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8, 1); return tex;
        }

        function buildMap() {
            const terrGeo = new THREE.PlaneGeometry(mapData.terrainWidth, mapData.terrainLength, 30, 30); terrGeo.rotateX(-Math.PI / 2);
            const verts = terrGeo.attributes.position.array;
            for (let i = 0; i < verts.length; i += 3) verts[i + 1] = Math.sin(verts[i]/mapData.noiseScale) * Math.cos(verts[i+2]/mapData.noiseScale) * mapData.maxHeight * 0.3; 
            terrGeo.computeVertexNormals();
            const terrain = new THREE.Mesh(terrGeo, new THREE.MeshLambertMaterial({ color: mapData.terrainColor })); terrain.matrixAutoUpdate = false; terrain.updateMatrix(); scene.add(terrain); collidableObjects.push(terrain); 

            const segs = 350, hW = mapData.trackWidth / 2; const rV=[], rI=[], rUV=[], lRV=[], rRV=[], railI=[], railUV=[]; const worldUp = new THREE.Vector3(0, 1, 0);

            for (let i = 0; i <= segs; i++) {
                const t = i / segs; const pt = trackCurve.getPointAt(t); const tangent = trackCurve.getTangentAt(t).normalize();
                let right = new THREE.Vector3().crossVectors(tangent, worldUp); if (right.lengthSq() < 0.001) right.set(1, 0, 0); right.normalize();
                let up = new THREE.Vector3().crossVectors(right, tangent).normalize(); if (up.y < 0) { right.negate(); up.negate(); }
                const ptL = pt.clone().add(right.clone().multiplyScalar(-hW)); const ptR = pt.clone().add(right.clone().multiplyScalar(hW));
                rV.push(ptL.x, ptL.y, ptL.z, ptR.x, ptR.y, ptR.z); rUV.push(0, t * (segs/25), 1, t * (segs/25));
                const lT = ptL.clone().add(up.clone().multiplyScalar(12)).add(right.clone().multiplyScalar(-3)); const lB = ptL.clone().add(up.clone().multiplyScalar(1)).add(right.clone().multiplyScalar(-3)); lRV.push(lT.x, lT.y, lT.z, lB.x, lB.y, lB.z);
                const rT = ptR.clone().add(up.clone().multiplyScalar(12)).add(right.clone().multiplyScalar(3)); const rB = ptR.clone().add(up.clone().multiplyScalar(1)).add(right.clone().multiplyScalar(3)); rRV.push(rT.x, rT.y, rT.z, rB.x, rB.y, rB.z);
                railUV.push(0, t * (segs/4), 1, t * (segs/4));
            }
            for (let i = 0; i < segs; i++) { const vL = i*2, vR = i*2+1, vNL = (i+1)*2, vNR = (i+1)*2+1; rI.push(vL, vR, vNL, vNL, vR, vNR); railI.push(vL, vR, vNL, vNL, vR, vNR); }

            const roadGeo = new THREE.BufferGeometry(); roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(rV, 3)); roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(rUV, 2)); roadGeo.setIndex(rI); roadGeo.computeVertexNormals();
            const roadMesh = new THREE.Mesh(roadGeo, new THREE.MeshLambertMaterial({ map: generateHighwayTexture(), side: THREE.DoubleSide })); roadMesh.matrixAutoUpdate = false; roadMesh.updateMatrix(); scene.add(roadMesh); collidableObjects.push(roadMesh);

            const railMat = new THREE.MeshLambertMaterial({ map: generateGuardrailTexture(), side: THREE.DoubleSide });
            const lRailGeo = new THREE.BufferGeometry(); lRailGeo.setAttribute('position', new THREE.Float32BufferAttribute(lRV, 3)); lRailGeo.setAttribute('uv', new THREE.Float32BufferAttribute(railUV, 2)); lRailGeo.setIndex(railI); lRailGeo.computeVertexNormals(); const lRailMesh = new THREE.Mesh(lRailGeo, railMat); lRailMesh.matrixAutoUpdate = false; lRailMesh.updateMatrix(); scene.add(lRailMesh);
            const rRailGeo = new THREE.BufferGeometry(); rRailGeo.setAttribute('position', new THREE.Float32BufferAttribute(rRV, 3)); rRailGeo.setAttribute('uv', new THREE.Float32BufferAttribute(railUV, 2)); rRailGeo.setIndex(railI); rRailGeo.computeVertexNormals(); const rRailMesh = new THREE.Mesh(rRailGeo, railMat); rRailMesh.matrixAutoUpdate = false; rRailMesh.updateMatrix(); scene.add(rRailMesh);

            const trackLength = trackCurve.getLength(); const numBridges = Math.floor(trackLength / 800); const pillarMat = new THREE.MeshLambertMaterial({ color: 0xaa1111 }); const cableMat = new THREE.MeshBasicMaterial({ color: 0x111111 }); const pillarGeo = new THREE.BoxGeometry(40, 500, 40); const crossbeamGeo = new THREE.BoxGeometry((hW * 2) + 120, 20, 40);
            
            for(let b = 1; b <= numBridges; b++) {
                const t = b / (numBridges + 1); const pt = trackCurve.getPointAt(t); const tangent = trackCurve.getTangentAt(t).normalize();
                let right = new THREE.Vector3().crossVectors(tangent, worldUp); if (right.lengthSq() < 0.001) right.set(1, 0, 0); right.normalize(); let up = new THREE.Vector3().crossVectors(right, tangent).normalize(); if (up.y < 0) right.negate();
                
                const leftPillar = new THREE.Mesh(pillarGeo, pillarMat); leftPillar.position.copy(pt).add(right.clone().multiplyScalar(-(hW + 40))); leftPillar.position.y += 100; leftPillar.matrixAutoUpdate = false; leftPillar.updateMatrix(); scene.add(leftPillar);
                const rightPillar = new THREE.Mesh(pillarGeo, pillarMat); rightPillar.position.copy(pt).add(right.clone().multiplyScalar(hW + 40)); rightPillar.position.y += 100; rightPillar.matrixAutoUpdate = false; rightPillar.updateMatrix(); scene.add(rightPillar);
                const crossbeam = new THREE.Mesh(crossbeamGeo, pillarMat); crossbeam.position.copy(pt); crossbeam.position.y += 330; crossbeam.lookAt(crossbeam.position.clone().add(right)); crossbeam.matrixAutoUpdate = false; crossbeam.updateMatrix(); scene.add(crossbeam);

                for (let c = 1; c <= 4; c++) {
                    const cDist = c * 0.02; 
                    createCable(pt, leftPillar.position, rightPillar.position, trackCurve, t + cDist, hW, worldUp, cableMat);
                    createCable(pt, leftPillar.position, rightPillar.position, trackCurve, t - cDist, hW, worldUp, cableMat);
                }
            }

            startLinePos = trackCurve.getPointAt(0.05); startLineTan = trackCurve.getTangentAt(0.05).normalize();
            const startLineGeo = new THREE.PlaneGeometry(mapData.trackWidth - 10, 30); startLineGeo.rotateX(-Math.PI / 2);
            const startLine = new THREE.Mesh(startLineGeo, new THREE.MeshBasicMaterial({ map: generateCheckeredTexture(), transparent: true }));
            startLine.position.copy(startLinePos); startLine.position.y += 1.5; startLine.lookAt(startLinePos.clone().add(startLineTan)); scene.add(startLine);

            spawnPos = trackCurve.getPointAt(0.04); spawnTangent = trackCurve.getTangentAt(0.04).normalize();
        }

        function createCable(centerPt, leftPillarPos, rightPillarPos, curve, t, hW, worldUp, mat) {
            if(t < 0) t += 1; if(t > 1) t -= 1;
            const pt = curve.getPointAt(t); const tangent = curve.getTangentAt(t).normalize();
            let right = new THREE.Vector3().crossVectors(tangent, worldUp); if (right.lengthSq() < 0.001) right.set(1, 0, 0); right.normalize();
            const roadLeft = pt.clone().add(right.clone().multiplyScalar(-hW)); const roadRight = pt.clone().add(right.clone().multiplyScalar(hW));
            const towerTopLeft = leftPillarPos.clone(); towerTopLeft.y += 230; const towerTopRight = rightPillarPos.clone(); towerTopRight.y += 230;
            spawnCylinderBetween(towerTopLeft, roadLeft, 2, mat); spawnCylinderBetween(towerTopRight, roadRight, 2, mat);
        }

        function spawnCylinderBetween(vstart, vend, radius, material) {
            const distance = vstart.distanceTo(vend); const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, distance, 3, 1, false), material);
            mesh.position.copy(vend.clone().add(vstart).divideScalar(2)); mesh.lookAt(vstart); mesh.rotateX(Math.PI / 2); mesh.matrixAutoUpdate = false; mesh.updateMatrix(); scene.add(mesh);
        }

        buildMap();

        // ⚠️ Change 'ws://localhost:8765' to your Render 'wss://...' URL before final deployment to Netlify
        const socket = new WebSocket('ws://localhost:8765');
        const opponentCars = {}; const loadingOpponents = {};
        const loader = new THREE.GLTFLoader();

        socket.onopen = () => { socket.send(JSON.stringify({ type: "rejoin_race", room: roomCode, id: playerId })); };
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "state") {
                for (let pid in data.players) {
                    if (pid === playerId) continue;
                    const pState = data.players[pid];
                    
                    if (pState.model === undefined) continue;
                    
                    if (!opponentCars[pid] && !loadingOpponents[pid]) {
                        loadingOpponents[pid] = true; 
                        loader.load(carList[pState.model].file, function(gltf) {
                            const oppCar = gltf.scene; oppCar.scale.set(12, 12, 12);
                            oppCar.traverse(node => { if (node.isMesh && node.material && !node.material.map) node.material = new THREE.MeshLambertMaterial({ color: 0xcc2222 }); });
                            oppCar.position.set(pState.x, pState.y, pState.z); oppCar.quaternion.set(pState.qx, pState.qy, pState.qz, pState.qw);
                            scene.add(oppCar); opponentCars[pid] = { mesh: oppCar, targetPos: new THREE.Vector3(pState.x, pState.y, pState.z), targetQuat: new THREE.Quaternion(pState.qx, pState.qy, pState.qz, pState.qw), lastState: pState };
                        });
                    } else if (opponentCars[pid]) {
                        opponentCars[pid].targetPos.set(pState.x, pState.y, pState.z);
                        opponentCars[pid].targetQuat.set(pState.qx, pState.qy, pState.qz, pState.qw);
                        opponentCars[pid].lastState = pState; 
                    }
                }
            } else if (data.type === "player_finished") {
                const rankClass = data.rank <= 3 ? `rank-${data.rank}` : `rank-4`;
                document.getElementById('rank-list').innerHTML += `<div class="rank-item ${rankClass}">${data.rank}. ${data.name}</div>`;
                displayBanner(`${data.name} FINISHED ${data.rank}!`, "#fff", 3000);
            }
        };

        let activeCarMesh = null, exhaustFlames = null, speed = 0, steering = 0, recentGroundY = 0, closestIndex = 0;
        const normalMaxSpeed = 24.0, nitroMaxSpeed = 40.0, normalAcceleration = 0.35, nitroAcceleration = 1.0, deceleration = 0.20, turnSpeed = 0.035, maxSteerAngle = 0.5;
        let currentLap = 1, currentNitro = 3.0, passedHalfway = false, lastTime = performance.now(); 
        let raceState = 'countdown', totalLaps = 3;
        let lastLeaderboardUpdate = 0;
        const keys = { w: false, s: false, a: false, d: false, space: false };

        window.addEventListener('keydown', (e) => { if(raceState === 'racing') keys[e.key.toLowerCase() === ' '? 'space' : e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase() === ' '? 'space' : e.key.toLowerCase()] = false; });

        loader.load(carList[myCarIndex].file, function(gltf) {
            activeCarMesh = gltf.scene; activeCarMesh.scale.set(12, 12, 12);
            activeCarMesh.traverse((node) => { if (node.isMesh && node.material && !node.material.map) node.material = new THREE.MeshLambertMaterial({ color: 0x2266cc }); });
            
            exhaustFlames = new THREE.Group(); const flameGeo = new THREE.ConeGeometry(0.15, 0.8, 6).rotateX(Math.PI / 2); const flameMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            [{x: -0.06, y: 0.05, z: -0.22}, {x: 0.06, y: 0.05, z: -0.22}, {x: -0.1, y: 0.03, z: -0.20}, {x: 0.1, y: 0.03, z: -0.20}].forEach(pos => { const flame = new THREE.Mesh(flameGeo, flameMat.clone()); flame.position.set(pos.x, pos.y, pos.z); exhaustFlames.add(flame); });
            exhaustFlames.visible = false; activeCarMesh.add(exhaustFlames); scene.add(activeCarMesh);

            const slotOffsets = [ { right: -40, forward: 0 }, { right: 40, forward: 0 }, { right: -40, forward: -80 }, { right: 40, forward: -80 } ];
            const offset = slotOffsets[mySpawnSlot % 4];
            const rightVec = new THREE.Vector3().crossVectors(spawnTangent, new THREE.Vector3(0,1,0)).normalize();
            
            const gridPos = spawnPos.clone().add(rightVec.clone().multiplyScalar(offset.right)).add(spawnTangent.clone().multiplyScalar(offset.forward));
            activeCarMesh.position.set(gridPos.x, gridPos.y + 20, gridPos.z); activeCarMesh.lookAt(gridPos.clone().add(spawnTangent)); recentGroundY = gridPos.y;

            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => displayBanner("3", "#ffaa00", 900), 500); 
            setTimeout(() => displayBanner("2", "#ffaa00", 900), 1500); 
            setTimeout(() => displayBanner("1", "#ffaa00", 900), 2500);
            setTimeout(() => { displayBanner("GO!", "#00ff00", 1500); raceState = 'racing'; }, 3500);
            animate();
        });

        function animate() {
            requestAnimationFrame(animate);
            const timeNow = performance.now();
            const delta = (timeNow - lastTime) / 1000; lastTime = timeNow;

            if (activeCarMesh) {
                // Opponent Interpolation
                for (let pid in opponentCars) { let opp = opponentCars[pid]; opp.mesh.position.lerp(opp.targetPos, 0.2); opp.mesh.quaternion.slerp(opp.targetQuat, 0.2); }

                let isBoosting = keys.space && currentNitro > 0 && speed > 5 && raceState === 'racing';
                if (isBoosting) { currentNitro = Math.max(0, currentNitro - delta); document.getElementById('nitro-fill').style.width = (currentNitro / 3.0 * 100) + '%'; }
                
                if (activeCarMesh.position.y < -300) { speed = 0; activeCarMesh.position.set(spawnPos.x, spawnPos.y + 30, spawnPos.z); activeCarMesh.lookAt(spawnPos.clone().add(spawnTangent)); }

                const activeMaxSpeed = isBoosting ? nitroMaxSpeed : normalMaxSpeed; const activeAcceleration = isBoosting ? nitroAcceleration : normalAcceleration;
                if (keys.w) speed = Math.min(speed + activeAcceleration, activeMaxSpeed); else if (keys.s) speed = Math.max(speed - normalAcceleration, -normalMaxSpeed * 0.4); else { if (speed > 0) speed = Math.max(speed - deceleration, 0); if (speed < 0) speed = Math.min(speed + deceleration, 0); }
                if (!keys.space && speed > normalMaxSpeed) speed = Math.max(speed - deceleration * 3, normalMaxSpeed);
                document.getElementById('speed-value').innerText = Math.floor(Math.abs(speed) * 7.5);

                if (raceState === 'finished') { keys.w = keys.s = keys.a = keys.d = keys.space = false; if (speed > 0) speed = Math.max(speed - deceleration * 0.5, 0); }

                if (isBoosting) {
                    exhaustFlames.visible = true; const randomScale = 1.0 + Math.random() * 1.5; exhaustFlames.scale.set(randomScale, randomScale, randomScale + (Math.random() * 2.0));
                    const blueFlames = [0x0088ff, 0x00ffff, 0xddeeff]; exhaustFlames.children.forEach(flame => { flame.material.color.setHex(blueFlames[Math.floor(Math.random() * blueFlames.length)]); flame.material.opacity = 0.6 + Math.random() * 0.4; });
                } else exhaustFlames.visible = false;

                let steerInput = 0; if (Math.abs(speed) > 0.01) { const steerDir = speed > 0 ? 1 : -1; if (keys.a) steerInput += turnSpeed * steerDir; if (keys.d) steerInput -= turnSpeed * steerDir; }
                if (steerInput !== 0) steering = Math.max(-maxSteerAngle, Math.min(maxSteerAngle, steering + steerInput)); else steering *= 0.85; 
                activeCarMesh.rotateY(steering * (speed / activeMaxSpeed) * 0.5 * (isBoosting ? 0.4 : (speed > 15 ? 0.6 : 1.0))); activeCarMesh.translateZ(speed);

                // Car Collisions
                if (raceState === 'racing') {
                    for (let pid in opponentCars) {
                        let opp = opponentCars[pid], dx = activeCarMesh.position.x - opp.mesh.position.x, dz = activeCarMesh.position.z - opp.mesh.position.z, distSq = dx*dx + dz*dz;
                        if (distSq < 900 && distSq > 0) {
                            let dist = Math.sqrt(distSq), overlap = 30 - dist;
                            activeCarMesh.position.x += (dx/dist) * overlap * 0.5; activeCarMesh.position.z += (dz/dist) * overlap * 0.5; speed *= 0.90; 
                        }
                    }
                }

                closestIndex = 0;
                let closestDistSq = Infinity, closestPoint = null, closestTangent = null;
                for (let i = 0; i < trackCenterData.length; i++) {
                    const dx = activeCarMesh.position.x - trackCenterData[i].pt.x, dz = activeCarMesh.position.z - trackCenterData[i].pt.z, distSq = dx*dx + dz*dz;
                    if (distSq < closestDistSq) { closestDistSq = distSq; closestPoint = trackCenterData[i].pt; closestTangent = trackCenterData[i].tan; closestIndex = i; }
                }

                if (raceState === 'racing' && closestTangent && Math.abs(speed) > 2) {
                    if (closestTangent.dot(new THREE.Vector3(0,0,1).applyQuaternion(activeCarMesh.quaternion).normalize()) < -0.3) { if (!banner.innerHTML.includes("WRONG WAY")) displayBanner("WRONG WAY X", "#ff4444", 0, true); } 
                    else if (banner.innerHTML.includes("WRONG WAY")) hideBanner();
                }

                // Lap Logic
                if (closestIndex > 400 && closestIndex < 600) passedHalfway = true; 
                if (passedHalfway && closestIndex > 20 && closestIndex < 80 && speed > 0 && raceState === 'racing') { 
                    currentLap++;
                    if (currentLap > totalLaps) {
                        raceState = 'finished'; displayBanner("FINISH!", "#00ff00", 0, true); document.getElementById('lap-text').innerText = `FINISHED`;
                        document.getElementById('live-leaderboard').style.display = 'none'; 
                        if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "finish_race", room: roomCode, id: playerId }));
                        setTimeout(() => { document.getElementById('results-ui').style.display = 'flex'; hideBanner(); }, 3000);
                    } else {
                        document.getElementById('lap-text').innerText = `LAP ${currentLap} / ${totalLaps}`; displayBanner(`LAP ${currentLap}`, "#4da6ff", 2500); currentNitro = 3.0; document.getElementById('nitro-fill').style.width = '100%';
                    }
                    passedHalfway = false;
                }

                // Track Walls
                if (Math.sqrt(closestDistSq) > 135 && closestPoint) {
                    const overlap = Math.sqrt(closestDistSq) - 135; activeCarMesh.position.add(new THREE.Vector3(closestPoint.x - activeCarMesh.position.x, 0, closestPoint.z - activeCarMesh.position.z).normalize().multiplyScalar(overlap)); speed *= 0.90; 
                }

                // Gravity
                const rayOrigin = activeCarMesh.position.clone(); rayOrigin.y += 300; 
                const floorHits = new THREE.Raycaster(rayOrigin, new THREE.Vector3(0, -1, 0)).intersectObjects(collidableObjects);
                if (floorHits.length > 0) {
                    recentGroundY = floorHits[0].point.y; activeCarMesh.position.y += ((recentGroundY + 2.5) - activeCarMesh.position.y) * 0.4; 
                    let surfaceNormal = floorHits[0].face.normal.clone(); surfaceNormal.transformDirection(floorHits[0].object.matrixWorld); if (surfaceNormal.y < 0) surfaceNormal.negate();
                    const currentForward = new THREE.Vector3(0, 0, 1).applyQuaternion(activeCarMesh.quaternion).normalize(); const right = new THREE.Vector3().crossVectors(surfaceNormal, currentForward).normalize();
                    activeCarMesh.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, surfaceNormal, new THREE.Vector3().crossVectors(right, surfaceNormal).normalize())), 0.2); 
                } else activeCarMesh.position.y -= 5; 

                // Camera Logic
                const speedRatio = Math.max(0, speed) / nitroMaxSpeed; const speedPullBack = CAM_PULL * Math.pow(speedRatio, 1.5); 
                const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(activeCarMesh.quaternion).normalize();
                const targetCameraPos = activeCarMesh.position.clone().sub(forward.multiplyScalar(CAM_DIST + speedPullBack)); targetCameraPos.y = activeCarMesh.position.y + CAM_HEIGHT; 
                if (keys.space && currentNitro > 0 && speed > 5) { targetCameraPos.x += (Math.random()-0.5)*1.5; targetCameraPos.y += (Math.random()-0.5)*1.5; }
                camera.position.lerp(targetCameraPos, 0.3); camera.lookAt(activeCarMesh.position.clone().add(new THREE.Vector3(0, CAM_LOOK, 0)).add(forward.multiplyScalar(speedPullBack)));
                camera.fov += ((keys.space && currentNitro > 0 && speed > 5 ? 80 : 55) - camera.fov) * 0.1; camera.updateProjectionMatrix();

                // Live Leaderboard (Twice a second)
                if (raceState === 'racing' && timeNow - lastLeaderboardUpdate > 500) {
                    lastLeaderboardUpdate = timeNow;
                    let racers = [];
                    racers.push({ name: playerName, score: currentLap * 1000 + closestIndex, isMe: true });
                    for (let pid in opponentCars) {
                        let opp = opponentCars[pid].lastState;
                        if (opp) racers.push({ name: opp.name, score: (opp.lap * 1000) + opp.progress, isMe: false });
                    }
                    racers.sort((a, b) => b.score - a.score);
                    
                    let html = '';
                    racers.forEach((r, i) => {
                        let color = r.isMe ? '#00ffff' : '#fff';
                        html += `<div style="color:${color}; font-size:18px; margin-bottom:4px;">${i+1}. ${r.name}</div>`;
                    });
                    document.getElementById('live-ranks').innerHTML = html;
                }

                // Send network state
                if (socket.readyState === WebSocket.OPEN && raceState !== 'loading') {
                    socket.send(JSON.stringify({ 
                        type: "update", room: roomCode, id: playerId, 
                        state: { 
                            x: activeCarMesh.position.x, y: activeCarMesh.position.y, z: activeCarMesh.position.z, 
                            qx: activeCarMesh.quaternion.x, qy: activeCarMesh.quaternion.y, qz: activeCarMesh.quaternion.z, qw: activeCarMesh.quaternion.w, 
                            model: myCarIndex, 
                            name: playerName, lap: currentLap, progress: closestIndex 
                        } 
                    }));
                }
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
